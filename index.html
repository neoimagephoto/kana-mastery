<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="五十音學堂">
    <title>五十音日語自學堂 - Kana Learning App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffe6ec',
                            200: '#fcccd8',
                            300: '#fa9bb2',
                            400: '#f66286',
                            500: '#ee3663',
                            600: '#db1d4f',
                        },
                        fuji: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        matcha: {
                            50: '#f4f9f4',
                            500: '#52b788',
                            600: '#40916c',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f8f9fa;
        }
        
        /* Smooth scrolling & hide scrollbars for app-like clean interface */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Card active feedback animation */
        .active-scale {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.95);
        }

        /* Safe area support for iOS home indicator and notch */
        .pb-safe {
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 16px));
        }
        .pt-safe {
            padding-top: max(1rem, env(safe-area-inset-top, 0px));
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased overflow-hidden selection:bg-sakura-200">

    <!-- App Navigation Top Bar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20 pt-safe px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="w-8 h-8 rounded-full bg-sakura-100 text-sakura-500 flex items-center justify-center font-bold text-lg shadow-inner">あ</span>
            <h1 class="text-lg font-bold text-slate-800 tracking-tight" id="headerTitle">五十音學堂</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="playSampleAudio()" title="測試音訊" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-sakura-50 text-slate-600 hover:text-sakura-500 flex items-center justify-center transition active-scale">
                <i class="fa-solid me-0 fa-volume-high text-sm"></i>
            </button>
            <div id="streakBadge" class="bg-amber-50 border border-amber-200 text-amber-700 text-xs px-2.5 py-1 rounded-full flex items-center space-x-1 font-semibold">
                <i class="fa-solid fa-fire text-amber-500"></i>
                <span id="streakCount">1 天</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto pb-safe no-scrollbar" id="mainContainer">
        
        <!-- ==================== TAB 1: LEARN (假名庫) ==================== -->
        <section id="tab-learn" class="p-4 max-w-lg mx-auto space-y-4">
            
            <!-- Type Toggle & Filter -->
            <div class="bg-slate-200/60 p-1 rounded-2xl flex text-sm font-semibold text-slate-600">
                <button id="btn-hiragana" onclick="switchKanaType('hiragana')" class="flex-1 py-2 rounded-xl bg-white text-sakura-600 shadow-sm transition-all duration-200 text-center">
                    平假名 (Hiragana)
                </button>
                <button id="btn-katakana" onclick="switchKanaType('katakana')" class="flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 text-center">
                    片假名 (Katakana)
                </button>
            </div>

            <!-- Category Filter Tabs -->
            <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-white shadow-sm whitespace-nowrap">全部</button>
                <button onclick="filterCategory('seion')" id="cat-seion" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap">清音 (五十音)</button>
                <button onclick="filterCategory('dakuon')" id="cat-dakuon" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap">濁音 / 半濁音</button>
                <button onclick="filterCategory('youon')" id="cat-youon" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap">拗音</button>
            </div>

            <!-- Progress mini bar -->
            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-sakura-50 flex items-center justify-center text-sakura-500">
                        <i class="fa-solid fa-circle-check text-lg"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">當前庫掌握進度</div>
                        <div class="text-sm font-bold text-slate-800" id="currentMasteryText">0 / 46 (0%)</div>
                    </div>
                </div>
                <div class="w-24 bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div id="currentMasteryBar" class="bg-sakura-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- Kana Grid Container -->
            <div id="kanaGrid" class="grid grid-cols-5 gap-2.5">
                <!-- Dynamically populated Kana Cards -->
            </div>
        </section>

        <!-- ==================== TAB 2: QUIZ (隨機測驗) ==================== -->
        <section id="tab-quiz" class="p-4 max-w-lg mx-auto hidden space-y-4">
            
            <!-- Quiz Configuration View -->
            <div id="quizSetupCard" class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-5">
                <div class="text-center space-y-1">
                    <div class="w-14 h-14 bg-fuji-50 text-fuji-500 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">五十音隨機測驗</h2>
                    <p class="text-xs text-slate-400">通過測驗檢驗記憶成果，強化弱項</p>
                </div>

                <!-- Range Selector -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">1. 選擇測驗範圍</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setQuizRange('all')" id="qrange-all" class="qrange-btn py-2.5 px-2 rounded-xl border-2 border-fuji-500 bg-fuji-50 text-fuji-600 text-xs font-bold transition">全部假名</button>
                        <button onclick="setQuizRange('hiragana')" id="qrange-hiragana" class="qrange-btn py-2.5 px-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-bold transition">僅平假名</button>
                        <button onclick="setQuizRange('katakana')" id="qrange-katakana" class="qrange-btn py-2.5 px-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-bold transition">僅片假名</button>
                    </div>
                </div>

                <!-- Type Selector -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. 選擇題目模式</label>
                    <select id="quizTypeSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl p-3 focus:outline-none focus:border-fuji-500">
                        <option value="kana2romaji">看假名 ➔ 選羅馬拼音</option>
                        <option value="audio2kana">聽語音 ➔ 選正確假名</option>
                        <option value="word2kana">看常用詞 ➔ 選對應假名</option>
                    </select>
                </div>

                <!-- Start Button -->
                <button onclick="startQuiz()" class="w-full py-3.5 bg-fuji-500 hover:bg-fuji-600 text-white font-bold rounded-2xl shadow-lg shadow-fuji-500/20 active-scale flex items-center justify-center space-x-2 text-base">
                    <span>開始 10 題測驗</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- Active Quiz View Container -->
            <div id="quizActiveCard" class="hidden space-y-4">
                <!-- Quiz Header Progress -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full" id="quizQuestionNum">第 1 / 10 題</span>
                        <span class="text-xs text-slate-400" id="quizScoreCount">得分: 0</span>
                    </div>
                    <button onclick="exitQuiz()" class="text-xs text-slate-400 hover:text-slate-600">結束測驗</button>
                </div>

                <!-- Question Box -->
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm text-center space-y-4 relative overflow-hidden">
                    <div class="text-xs font-bold text-fuji-500 uppercase tracking-widest" id="quizTypeLabel">請選擇正確拼音</div>
                    
                    <div id="quizPromptBox" class="min-h-[100px] flex flex-col items-center justify-center">
                        <!-- Dynamic prompt: character, audio button, or word -->
                    </div>

                    <div id="quizFeedback" class="h-6 text-sm font-bold flex items-center justify-center space-x-1 opacity-0 transition-opacity">
                        <!-- Correct/Wrong text -->
                    </div>
                </div>

                <!-- Answer Choices (4 options) -->
                <div id="quizOptionsGrid" class="grid grid-cols-2 gap-3">
                    <!-- Dynamic buttons -->
                </div>
            </div>

            <!-- Quiz Summary Result Card -->
            <div id="quizResultCard" class="hidden bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center space-y-5">
                <div class="w-20 h-20 rounded-full bg-emerald-50 text-emerald-500 mx-auto flex items-center justify-center text-4xl shadow-inner">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div>
                    <h3 class="text-2xl font-bold text-slate-800">測驗完成！</h3>
                    <p class="text-sm text-slate-500 mt-1" id="quizResultDetail">你獲得了 80 分</p>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-left space-y-2">
                    <div class="text-xs font-bold text-slate-400 uppercase">錯題複習建議</div>
                    <div id="quizWrongList" class="text-sm text-slate-600 flex flex-wrap gap-1.5">
                        <!-- Dynamic wrong item pills -->
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button onclick="resetToQuizSetup()" class="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl active-scale text-sm">再次測驗</button>
                    <button onclick="switchTab('learn')" class="flex-1 py-3 bg-sakura-500 text-white font-bold rounded-xl shadow-md shadow-sakura-500/20 active-scale text-sm">回到假名庫</button>
                </div>
            </div>

        </section>

        <!-- ==================== TAB 3: PROGRESS (學習進度) ==================== -->
        <section id="tab-progress" class="p-4 max-w-lg mx-auto hidden space-y-4">
            
            <!-- Mastery Overview Card -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center space-x-2">
                    <i class="fa-solid fa-chart-pie text-sakura-500"></i>
                    <span>五十音掌握進度概覽</span>
                </h2>

                <!-- Hiragana Progress -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-slate-600">平假名掌握率</span>
                        <span class="text-sakura-600" id="progHiraText">0% (0/46)</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="progHiraBar" class="bg-sakura-400 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Katakana Progress -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-slate-600">片假名掌握率</span>
                        <span class="text-fuji-600" id="progKataText">0% (0/46)</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="progKataBar" class="bg-fuji-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">連續學習天數</div>
                        <div class="text-lg font-bold text-slate-800" id="statStreak">1 天</div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-500 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-award"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">測驗最高得分</div>
                        <div class="text-lg font-bold text-slate-800" id="statHighScore">0 分</div>
                    </div>
                </div>
            </div>

            <!-- Reset Data Zone -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                <h3 class="text-sm font-bold text-slate-800">進度管理</h3>
                <p class="text-xs text-slate-400">如需重新建構記憶，可以清空目前所有的歷史掌握記錄。</p>
                <button onclick="confirmResetProgress()" class="w-full py-2.5 border border-red-200 text-red-500 hover:bg-red-50 font-semibold rounded-xl text-xs transition active-scale">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 重置所有學習進度
                </button>
            </div>

        </section>

        <!-- ==================== TAB 4: SEARCH (搜尋與速查) ==================== -->
        <section id="tab-search" class="p-4 max-w-lg mx-auto hidden space-y-4">
            
            <!-- Search Bar Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="輸入假名、羅馬拼音、字源或中文詞彙..." class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-sakura-400 shadow-sm">
            </div>

            <!-- Search Results Counter -->
            <div class="text-xs font-semibold text-slate-400 px-1" id="searchCountText">請輸入關鍵字進行快速檢索</div>

            <!-- Search Results List -->
            <div id="searchResultsList" class="space-y-2">
                <!-- Dynamic results -->
            </div>

        </section>

    </main>

    <!-- Detail Learning Modal Overlay -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-300">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl p-6 space-y-5 animate-slide-up">
            
            <!-- Modal Top Bar -->
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <span class="text-xs font-bold text-sakura-500 bg-sakura-50 px-3 py-1 rounded-full uppercase tracking-wider" id="modalTypeBadge">平假名 • 清音</span>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-100 text-slate-500 hover:bg-slate-200 rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Character Hero Box -->
            <div class="flex items-center justify-between bg-gradient-to-br from-sakura-50 to-orange-50/50 p-5 rounded-2xl border border-sakura-100">
                <div class="space-y-1">
                    <div id="modalChar" class="text-6xl font-black text-slate-800 leading-none">あ</div>
                    <div id="modalRomaji" class="text-lg font-bold text-sakura-600">a</div>
                </div>

                <!-- Visual Memory SVG Graphic -->
                <div class="w-20 h-20 bg-white rounded-xl shadow-sm border border-slate-100 p-2 flex flex-col items-center justify-center text-center">
                    <div id="modalSvgGraphic" class="w-10 h-10 flex items-center justify-center text-sakura-500 text-2xl font-bold">
                        <!-- Origin SVG / Icon -->
                    </div>
                    <div id="modalOrigin" class="text-[10px] font-bold text-slate-500 mt-1">源自：安</div>
                </div>

                <!-- Speech Audio Trigger Button -->
                <button id="modalAudioBtn" onclick="speakCurrentModal()" class="w-14 h-14 bg-sakura-500 hover:bg-sakura-600 text-white rounded-2xl shadow-lg shadow-sakura-500/30 flex items-center justify-center text-xl active-scale">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>

            <!-- 3 Common Vocabulary Words -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
                    <i class="fa-solid fa-book-bookmark text-sakura-400"></i>
                    <span>3 個常用詞彙</span>
                </h4>
                <div id="modalWordsList" class="space-y-2">
                    <!-- Dynamic 3 words -->
                </div>
            </div>

            <!-- 3 Practical Sentences -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
                    <i class="fa-solid fa-comments text-fuji-400"></i>
                    <span>3 句簡單實用例句</span>
                </h4>
                <div id="modalSentencesList" class="space-y-2">
                    <!-- Dynamic 3 sentences -->
                </div>
            </div>

            <!-- Mastery Toggle Switch -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                <span class="text-sm font-bold text-slate-700">標記為已掌握：</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="modalMasteredToggle" onchange="toggleMasteryFromModal()" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>

        </div>
    </div>

    <!-- Bottom Tab Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 z-30 pb-[env(safe-area-inset-bottom,0px)]">
        <div class="max-w-lg mx-auto flex justify-around items-center h-16">
            <button onclick="switchTab('learn')" id="tabBtn-learn" class="tab-item flex flex-col items-center justify-center w-full h-full text-sakura-500 font-bold transition">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[10px] mt-1">假名庫</span>
            </button>
            <button onclick="switchTab('quiz')" id="tabBtn-quiz" class="tab-item flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-circle-question text-lg"></i>
                <span class="text-[10px] mt-1">隨機測驗</span>
            </button>
            <button onclick="switchTab('progress')" id="tabBtn-progress" class="tab-item flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] mt-1">學習進度</span>
            </button>
            <button onclick="switchTab('search')" id="tabBtn-search" class="tab-item flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span class="text-[10px] mt-1">搜尋</span>
            </button>
        </div>
    </nav>

    <script>
        const KANA_DATABASE = [
            // ==========================================
            // HIRAGANA SEION (平假名 46清音)
            // ==========================================
            {
                id: "h_a", char: "あ", type: "hiragana", category: "seion", romaji: "a", origin: "安",
                svgIcon: `<svg viewBox="0 0 100 100" class="w-8 h-8"><text x="50" y="65" text-anchor="middle" font-size="45" font-weight="bold" fill="#ee3663">安</text></svg>`,
                words: [
                    { japanese: "朝", kana: "あさ", meaning: "早上" },
                    { japanese: "雨", kana: "あめ", meaning: "雨" },
                    { japanese: "青", kana: "あお", meaning: "藍色" }
                ],
                sentences: [
                    { japanese: "朝起きます。", kana: "あさ おきます", meaning: "早上起床。" },
                    { japanese: "雨が降っています。", kana: "あめ が ふっています", meaning: "正在下雨。" },
                    { japanese: "青い空が見える。", kana: "あおい そら が みえる", meaning: "看得到藍天。" }
                ]
            },

        function speakJapanese(text) {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援 Web Speech 語音朗讀功能');
                return;
            }
            window.speechSynthesis.cancel(); // Stop current playing
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9; // Slightly slower for language learners
            window.speechSynthesis.speak(utterance);
        }

        function playSampleAudio() {
            speakJapanese('こんにちは！日本語の勉強を始めましょう');
        }

        function switchTab(tabName) {
            state.currentTab = tabName;
            
            // Hide all tabs
            ['learn', 'quiz', 'progress', 'search'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                const btn = document.getElementById(`tabBtn-${tab}`);
                btn.classList.remove('text-sakura-500', 'font-bold');
                btn.classList.add('text-slate-400');
            });

            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('text-sakura-500', 'font-bold');

            // Update Header Title
            const titles = {
                learn: '假名學習庫',
                quiz: '隨機測驗',
                progress: '學習進度',
                search: '假名速查'
            };
            document.getElementById('headerTitle').innerText = titles[tabName];

            if (tabName === 'progress') updateProgressTab();
            if (tabName === 'search') handleSearch();
        }

        function switchKanaType(type) {
            state.kanaType = type;
            const btnHira = document.getElementById('btn-hiragana');
            const btnKata = document.getElementById('btn-katakana');

            if (type === 'hiragana') {
                btnHira.className = "flex-1 py-2 rounded-xl bg-white text-sakura-600 shadow-sm transition-all duration-200 text-center font-bold";
                btnKata.className = "flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 text-center font-normal";
            } else {
                btnKata.className = "flex-1 py-2 rounded-xl bg-white text-fuji-600 shadow-sm transition-all duration-200 text-center font-bold";
                btnHira.className = "flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 text-center font-normal";
            }
            renderKanaGrid();
        }

        function filterCategory(cat) {
            state.categoryFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap";
            });
            const active = document.getElementById(`cat-${cat}`);
            if (active) {
                active.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-white shadow-sm whitespace-nowrap";
            }
            renderKanaGrid();
        }

        function renderKanaGrid() {
            const grid = document.getElementById('kanaGrid');
            grid.innerHTML = '';

            const filtered = KANA_DATABASE.filter(item => {
                const matchType = item.type === state.kanaType;
                const matchCat = state.categoryFilter === 'all' || item.category === state.categoryFilter;
                return matchType && matchCat;
            });

            // Update current mastery counter
            const totalCount = filtered.length;
            const masteredCount = filtered.filter(item => state.masteredIds.includes(item.id)).length;
            const percent = totalCount > 0 ? Math.round((masteredCount / totalCount) * 100) : 0;
            document.getElementById('currentMasteryText').innerText = `${masteredCount} / ${totalCount} (${percent}%)`;
            document.getElementById('currentMasteryBar').style.width = `${percent}%`;

            filtered.forEach(item => {
                const isMastered = state.masteredIds.includes(item.id);
                const card = document.createElement('div');
                card.onclick = () => openModal(item);
                card.className = `active-scale relative bg-white p-3 rounded-2xl border ${isMastered ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-100'} shadow-sm flex flex-col items-center justify-center cursor-pointer transition`;
                
                card.innerHTML = `
                    ${isMastered ? '<i class="fa-solid fa-circle-check absolute top-1.5 right-1.5 text-emerald-500 text-xs"></i>' : ''}
                    <div class="text-2xl font-black ${item.type === 'hiragana' ? 'text-slate-800' : 'text-fuji-600'}">${item.char}</div>
                    <div class="text-[10px] font-bold text-slate-400 mt-0.5">${item.romaji}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleMasteryFromModal() {
            if (!state.activeModalKana) return;
            const id = state.activeModalKana.id;
            const index = state.masteredIds.indexOf(id);
            if (index > -1) {
                state.masteredIds.splice(index, 1);
            } else {
                state.masteredIds.push(id);
            }
            localStorage.setItem('kana_mastered', JSON.stringify(state.masteredIds));
            renderKanaGrid();
        }

        function setQuizRange(range) {
            state.quizRange = range;
            document.querySelectorAll('.qrange-btn').forEach(btn => {
                btn.className = "qrange-btn py-2.5 px-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-bold transition";
            });
            const active = document.getElementById(`qrange-${range}`);
            if (active) {
                active.className = "qrange-btn py-2.5 px-2 rounded-xl border-2 border-fuji-500 bg-fuji-50 text-fuji-600 text-xs font-bold transition";
            }
        }

        function startQuiz() {
            let pool = KANA_DATABASE;
            if (state.quizRange === 'hiragana') pool = KANA_DATABASE.filter(k => k.type === 'hiragana');
            if (state.quizRange === 'katakana') pool = KANA_DATABASE.filter(k => k.type === 'katakana');

            if (pool.length < 4) {
                alert('目前測驗庫題目不足，請切換範圍');
                return;
            }

            // Shuffle pool & select 10 questions
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            state.quizQuestions = shuffled.slice(0, 10);
            state.quizIndex = 0;
            state.quizScore = 0;
            state.quizWrong = [];

            document.getElementById('quizSetupCard').classList.add('hidden');
            document.getElementById('quizResultCard').classList.add('hidden');
            document.getElementById('quizActiveCard').classList.remove('hidden');

            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const current = state.quizQuestions[state.quizIndex];
            const qType = document.getElementById('quizTypeSelect').value;
            
            document.getElementById('quizQuestionNum').innerText = `第 ${state.quizIndex + 1} / 10 題`;
            document.getElementById('quizScoreCount').innerText = `得分: ${state.quizScore}`;

            const promptBox = document.getElementById('quizPromptBox');
            promptBox.innerHTML = '';

            // Render Prompt according to question type
            if (qType === 'kana2romaji') {
                document.getElementById('quizTypeLabel').innerText = "請選擇正確的羅馬拼音";
                promptBox.innerHTML = `<div class="text-6xl font-black text-slate-800">${current.char}</div>`;
            } else if (qType === 'audio2kana') {
                document.getElementById('quizTypeLabel').innerText = "請點擊朗讀並選擇正確的假名";
                promptBox.innerHTML = `
                    <button onclick="speakJapanese('${current.char}')" class="w-16 h-16 rounded-full bg-fuji-500 text-white text-2xl flex items-center justify-center shadow-md active-scale">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="text-xs text-slate-400 mt-2">點擊播放發音</div>
                `;
                speakJapanese(current.char);
            } else if (qType === 'word2kana') {
                document.getElementById('quizTypeLabel').innerText = "常用詞對應假名選擇";
                const randomWord = current.words[0];
                promptBox.innerHTML = `
                    <div class="text-2xl font-bold text-slate-800">${randomWord.japanese}</div>
                    <div class="text-xs text-slate-500 mt-1">含義：${randomWord.meaning}</div>
                `;
            }

            // Generate 4 options
            let optionsPool = KANA_DATABASE.filter(k => k.id !== current.id);
            optionsPool = optionsPool.sort(() => 0.5 - Math.random()).slice(0, 3);
            optionsPool.push(current);
            optionsPool = optionsPool.sort(() => 0.5 - Math.random());

            const optionsGrid = document.getElementById('quizOptionsGrid');
            optionsGrid.innerHTML = '';

            optionsPool.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "py-4 bg-white border border-slate-200 hover:border-fuji-400 rounded-2xl font-bold text-slate-800 shadow-sm transition active-scale text-lg";
                
                if (qType === 'kana2romaji') {
                    btn.innerText = opt.romaji;
                } else {
                    btn.innerText = opt.char;
                }

                btn.onclick = () => handleAnswer(opt, current, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(selectedOpt, correctOpt, btnElement) {
            const feedback = document.getElementById('quizFeedback');
            const isCorrect = selectedOpt.id === correctOpt.id;

            if (isCorrect) {
                state.quizScore += 10;
                btnElement.className = "py-4 bg-emerald-500 text-white rounded-2xl font-bold shadow-md text-lg";
                feedback.innerHTML = `<span class="text-emerald-500"><i class="fa-solid fa-circle-check"></i> 答對了！</span>`;
            } else {
                state.quizWrong.push(correctOpt);
                btnElement.className = "py-4 bg-red-500 text-white rounded-2xl font-bold shadow-md text-lg";
                feedback.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-circle-xmark"></i> 正確答案是：${correctOpt.char} (${correctOpt.romaji})</span>`;
            }

            feedback.style.opacity = "1";

            setTimeout(() => {
                feedback.style.opacity = "0";
                state.quizIndex++;
                if (state.quizIndex < 10) {
                    renderQuizQuestion();
                } else {
                    finishQuiz();
                }
            }, 1200);
        }

        function finishQuiz() {
            document.getElementById('quizActiveCard').classList.add('hidden');
            document.getElementById('quizResultCard').classList.remove('hidden');

            document.getElementById('quizResultDetail').innerText = `本次得分：${state.quizScore} 分 / 100 分`;

            // Save high score
            if (state.quizScore > state.highScore) {
                state.highScore = state.quizScore;
                localStorage.setItem('kana_highscore', state.highScore.toString());
            }

            // Populate wrong list
            const wrongList = document.getElementById('quizWrongList');
            wrongList.innerHTML = '';
            if (state.quizWrong.length === 0) {
                wrongList.innerHTML = `<span class="text-xs text-emerald-600 font-bold"><i class="fa-solid fa-star"></i> 太棒了！本次沒有任何錯題！</span>`;
            } else {
                state.quizWrong.forEach(item => {
                    const pill = document.createElement('span');
                    pill.className = "bg-red-50 border border-red-200 text-red-600 text-xs px-2.5 py-1 rounded-full font-bold cursor-pointer";
                    pill.innerText = `${item.char} (${item.romaji})`;
                    pill.onclick = () => openModal(item);
                    wrongList.appendChild(pill);
                });
            }
        }

        function resetToQuizSetup() {
            document.getElementById('quizResultCard').classList.add('hidden');
            document.getElementById('quizSetupCard').classList.remove('hidden');
        }

        function exitQuiz() {
            if (confirm('確定要結束本次測驗嗎？')) {
                resetToQuizSetup();
            }
        }

        function updateProgressTab() {
            const totalHira = KANA_DATABASE.filter(k => k.type === 'hiragana').length;
            const masteredHira = KANA_DATABASE.filter(k => k.type === 'hiragana' && state.masteredIds.includes(k.id)).length;
            const hiraPercent = totalHira > 0 ? Math.round((masteredHira / totalHira) * 100) : 0;

            document.getElementById('progHiraText').innerText = `${hiraPercent}% (${masteredHira}/${totalHira})`;
            document.getElementById('progHiraBar').style.width = `${hiraPercent}%`;

            const totalKata = KANA_DATABASE.filter(k => k.type === 'katakana').length;
            const masteredKata = KANA_DATABASE.filter(k => k.type === 'katakana' && state.masteredIds.includes(k.id)).length;
            const kataPercent = totalKata > 0 ? Math.round((masteredKata / totalKata) * 100) : 0;

            document.getElementById('progKataText').innerText = `${kataPercent}% (${masteredKata}/${totalKata})`;
            document.getElementById('progKataBar').style.width = `${kataPercent}%`;

            document.getElementById('statStreak').innerText = `${state.streakDays} 天`;
            document.getElementById('statHighScore').innerText = `${state.highScore} 分`;
        }

        function confirmResetProgress() {
            if (confirm('確定要清空所有已掌握記錄及最高分嗎？此操作不可逆。')) {
                state.masteredIds = [];
                state.highScore = 0;
                localStorage.removeItem('kana_mastered');
                localStorage.removeItem('kana_highscore');
                updateProgressTab();
                renderKanaGrid();
                alert('進度已成功重置！');
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsList = document.getElementById('searchResultsList');
            const countText = document.getElementById('searchCountText');

            if (!query) {
                resultsList.innerHTML = '';
                countText.innerText = '請輸入關鍵字進行快速檢索';
                return;
            }

            const results = KANA_DATABASE.filter(item => {
                const matchChar = item.char.includes(query);
                const matchRomaji = item.romaji.toLowerCase().includes(query);
                const matchOrigin = item.origin.includes(query);
                const matchWord = item.words.some(w => w.japanese.includes(query) || w.meaning.includes(query));
                return matchChar || matchRomaji || matchOrigin || matchWord;
            });

            countText.innerText = `找到 ${results.length} 個相關結果`;
            resultsList.innerHTML = '';

            results.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between active-scale cursor-pointer";
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="text-3xl font-black ${item.type === 'hiragana' ? 'text-sakura-500' : 'text-fuji-500'}">${item.char}</div>
                        <div>
                            <div class="text-sm font-bold text-slate-800">${item.romaji} <span class="text-xs font-normal text-slate-400">(源自：${item.origin})</span></div>
                            <div class="text-xs text-slate-500">例詞：${item.words[0].japanese} (${item.words[0].meaning})</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                `;
                resultsList.appendChild(card);
            });
        }

        function checkStreak() {
            const today = new Date().toISOString().split('T')[0];
            if (!state.lastStudyDate) {
                state.lastStudyDate = today;
                localStorage.setItem('kana_last_date', today);
            } else if (state.lastStudyDate !== today) {
                const last = new Date(state.lastStudyDate);
                const curr = new Date(today);
                const diffDays = Math.round((curr - last) / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    state.streakDays += 1;
                } else if (diffDays > 1) {
                    state.streakDays = 1;
                }
                state.lastStudyDate = today;
                localStorage.setItem('kana_streak', state.streakDays.toString());
                localStorage.setItem('kana_last_date', today);
            }
            document.getElementById('streakCount').innerText = `${state.streakDays} 天`;
        }

        window.onload = function() {
            checkStreak();
            renderKanaGrid();
        };
    </script>
</body>
</html>
